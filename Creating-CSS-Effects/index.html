<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creating CSS Effects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Creating CSS Effects</h1>
        <p>This webpage demonstrates different CSS effects.</p>
    </header>

    <section class="card-section">
        <div class="card">
            <h2>Hover Effect</h2>
            <p>Move your mouse over this box to see a CSS hover effect.</p>
        </div>

        <div class="card">
            <h2>Shadow Effect</h2>
            <p>This card uses box-shadow to create depth.</p>
        </div>

        <div class="card">
            <h2>Transition Effect</h2>
            <p>CSS transitions make changes look smooth.</p>
        </div>
    </section>

    <section class="button-section">
        <button>Hover Over Me</button>
    </section>

    <section class="animation-section">
        <div class="circle"></div>
        <p>This circle uses CSS animation.</p>
    </section>

</body>
</html>

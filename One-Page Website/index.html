<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Page Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>My Favorite Music Video</h1>

        <p>
            Welcome to my one-page website. This page includes a YouTube music video,
            CSS styling, JavaScript animation, and a functional lightbox image gallery.
        </p>

        <iframe 
            width="560" 
            height="315" 
            src="https://www.youtube.com/embed/dQw4w9WgXcQ"
            title="YouTube video player"
            frameborder="0"
            allowfullscreen>
        </iframe>

        <br><br>

        <button onclick="startAnimation()">Click for Animation</button>

        <div id="musicNote">♪</div>

        <h2>Image Gallery</h2>

        <div class="gallery">
            <img src="images/Image1.png" alt="Mountain Lake" onclick="openLightbox(this)">
            <img src="images/Image2.png" alt="City Night" onclick="openLightbox(this)">
            <img src="images/Image3.png" alt="Workspace" onclick="openLightbox(this)">
        </div>
    </div>

    <!-- Lightbox Modal Pop-Up -->
    <div id="lightbox" class="lightbox">
        <span class="close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="" alt="Expanded gallery image">
    </div>

    <script src="script.js"></script>

</body>
</html>
